<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
<marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
</defs>
<rect width="900" height="600" fill="#ffffff"/>
<rect x="440" y="100" width="440" height="462" rx="10" fill="#fafafa" stroke="#555" stroke-width="2" stroke-dasharray="9 6"/>
<text x="454" y="124" text-anchor="start" font-size="14" fill="#555555" font-weight="bold"><tspan>Oracle (server side)</tspan></text>
<text x="454" y="142" text-anchor="start" font-size="12" fill="#555555"><tspan>holds the key K</tspan></text>
<text x="40" y="28" text-anchor="start" font-size="14" fill="#555555" font-weight="bold"><tspan>Attacker</tspan></text>
<rect x="40" y="40" width="230" height="46" rx="6" fill="#eeeeee" stroke="#757575" stroke-width="2"/>
<text x="53" y="68" text-anchor="start" font-size="15" fill="#111"><tspan>C</tspan><tspan dy="4" font-size="11">i-1</tspan><tspan dy="-4"> (original block or IV)</tspan></text>
<line x1="155" y1="86" x2="155" y2="126" stroke="#c62828" stroke-width="2" marker-end="url(#arrRed)"/>
<text x="167" y="112" text-anchor="start" font-size="13" fill="#c62828"><tspan>attacker changes byte k</tspan></text>
<rect x="40" y="130" width="230" height="62" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/>
<text x="86" y="156" text-anchor="start" font-size="16" fill="#c62828" font-weight="bold"><tspan>C'</tspan><tspan dy="4" font-size="12">i-1</tspan><tspan dy="-4"> (modified)</tspan></text>
<text x="60" y="178" text-anchor="start" font-size="13" fill="#c62828"><tspan>guess g placed at position k</tspan></text>
<polyline points="155,192 155,340 636,340" fill="none" stroke="#c62828" stroke-width="2.5" marker-end="url(#arrRed)"/>
<text x="175" y="326" text-anchor="start" font-size="13" fill="#444"><tspan>sent to the oracle together with C</tspan><tspan dy="4" font-size="10">i</tspan><tspan dy="-4"> </tspan></text>
<text x="175" y="358" text-anchor="start" font-size="13" fill="#c62828"><tspan>C'</tspan><tspan dy="4" font-size="10">i-1</tspan><tspan dy="-4"> replaces C</tspan><tspan dy="4" font-size="10">i-1</tspan><tspan dy="-4"> in the XOR</tspan></text>
<rect x="560" y="30" width="200" height="44" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="575" y="57" text-anchor="start" font-size="15" fill="#111"><tspan>C</tspan><tspan dy="4" font-size="11">i</tspan><tspan dy="-4"> (target, unchanged)</tspan></text>
<line x1="660" y1="74" x2="660" y2="138" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<rect x="560" y="140" width="200" height="46" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
<text x="590" y="169" text-anchor="start" font-size="16" fill="#111"><tspan>AES decryption D</tspan><tspan dy="4" font-size="12">K</tspan><tspan dy="-4"> </tspan></text>
<line x1="660" y1="186" x2="660" y2="224" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<rect x="560" y="226" width="200" height="54" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
<text x="617" y="250" text-anchor="start" font-size="16" fill="#111"><tspan>I</tspan><tspan dy="4" font-size="12">i</tspan><tspan dy="-4"> = D</tspan><tspan dy="4" font-size="12">K</tspan><tspan dy="-4">(C</tspan><tspan dy="4" font-size="12">i</tspan><tspan dy="-4">)</tspan></text>
<text x="572" y="270" text-anchor="start" font-size="13" fill="#6a1b9a"><tspan>(hidden from the attacker)</tspan></text>
<line x1="660" y1="280" x2="660" y2="316" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<circle cx="660" cy="340" r="22" fill="#fff" stroke="#333" stroke-width="2.5"/>
<line x1="646" y1="340" x2="674" y2="340" stroke="#333" stroke-width="2.5"/><line x1="660" y1="326" x2="660" y2="354" stroke="#333" stroke-width="2.5"/>
<text x="694" y="336" text-anchor="start" font-size="14" fill="#333" font-weight="bold"><tspan>XOR</tspan></text>
<line x1="660" y1="362" x2="660" y2="400" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<rect x="540" y="402" width="240" height="46" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="590" y="431" text-anchor="start" font-size="16" fill="#111"><tspan>P'</tspan><tspan dy="4" font-size="12">i</tspan><tspan dy="-4"> = I</tspan><tspan dy="4" font-size="12">i</tspan><tspan dy="-4"> XOR C'</tspan><tspan dy="4" font-size="12">i-1</tspan><tspan dy="-4"> </tspan></text>
<line x1="660" y1="448" x2="660" y2="486" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<rect x="540" y="488" width="240" height="56" rx="6" fill="#fffde7" stroke="#333" stroke-width="2"/>
<text x="602" y="512" text-anchor="start" font-size="16" fill="#111" font-weight="bold"><tspan>Padding check</tspan></text>
<text x="589" y="532" text-anchor="start" font-size="13" fill="#444"><tspan>valid PKCS#7 padding?</tspan></text>
<line x1="540" y1="516" x2="300" y2="516" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<text x="318" y="508" text-anchor="start" font-size="14" fill="#111" font-weight="bold"><tspan>True / False</tspan></text>
<text x="30" y="392" text-anchor="start" font-size="13" fill="#111" font-weight="bold"><tspan>Start with the last byte (k = last byte of the block)</tspan></text>
<text x="30" y="416" text-anchor="start" font-size="13" fill="#2e7d32" font-weight="bold"><tspan>True: padding ends in 0x01, so the guess is right</tspan></text>
<text x="30" y="438" text-anchor="start" font-size="13" fill="#111"><tspan>P'</tspan><tspan dy="4" font-size="10">i</tspan><tspan dy="-4">[k] = I</tspan><tspan dy="4" font-size="10">i</tspan><tspan dy="-4">[k] XOR g = 0x01</tspan></text>
<text x="30" y="458" text-anchor="start" font-size="13" fill="#111"><tspan>so I</tspan><tspan dy="4" font-size="10">i</tspan><tspan dy="-4">[k] = g XOR 0x01</tspan></text>
<text x="30" y="478" text-anchor="start" font-size="13" fill="#111"><tspan>so P</tspan><tspan dy="4" font-size="10">i</tspan><tspan dy="-4">[k] = I</tspan><tspan dy="4" font-size="10">i</tspan><tspan dy="-4">[k] XOR C</tspan><tspan dy="4" font-size="10">i-1</tspan><tspan dy="-4">[k]  (original C</tspan><tspan dy="4" font-size="10">i-1</tspan><tspan dy="-4">)</tspan></text>
<text x="30" y="548" text-anchor="start" font-size="13" fill="#c62828" font-weight="bold"><tspan>False: wrong guess, try the next g</tspan></text>
<text x="30" y="572" text-anchor="start" font-size="12" fill="#444"><tspan>At most 256 values of g per byte, 128 tries on average</tspan></text>
</svg>